<!-- DOCTYPE - serve para indicar aos navegadores qual versão e padrão de HTML está sendo usado -->
<!DOCTYPE html>

<!-- HTML - Elemento raiz. Tudo que pertence ao documento HTML fica dentro dele. -->
 <!-- LANG/language (idioma) = atributo responsável por definir o idioma do documento, além de ter um grande impacto na acessibilidade e no SEO -->
<html lang="pt-br">

<head>

    <!-- charset = essa configuração indica ao navegador o padrão de caracteres a ser utilizado. Permite utilizar acentos e caracteres especiais -->
    <meta charset="UTF-8">

    <!-- viewport = configuração responsável por definir o tamanho da viewport do documento, que é exibida no navegador, se ajustando a cada dispositivo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- title/titulo = representa o título do documento, que é exibido na aba do navegador -->
    <title>Olá, mundo!</title>
</head>

<!-- BODY = elemento que contém todo o conteúdo visível do documento onde o usuario interage e consome os recursos da página. Titulos, parágrafos, imagens, etc. -->
<body>
    Olá, mundo. Este é o meu primeiro programa em HTML.
</body>

</html>
